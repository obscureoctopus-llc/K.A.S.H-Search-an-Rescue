[platformio]
src_dir = cyd/src
include_dir = cyd/include
test_dir = cyd/test
default_envs = cyd_esp32_2432s028r

[env:cyd_esp32_2432s028r]
platform      = espressif32 @ 7.0.1
board         = esp32dev
framework     = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    paulstoffregen/XPT2046_Touchscreen @ 1.4.0
build_flags =
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1

[env:native]
platform = native @ 1.2.1
test_framework = custom
test_build_src = no
build_flags = -std=c++11 -Wall -Wextra -Werror -UNDEBUG
